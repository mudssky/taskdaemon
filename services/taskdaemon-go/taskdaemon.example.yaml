# taskdaemon 默认配置示例。
# 复制到用户配置目录的 taskdaemon/config.yaml，或使用 --config 指向自定义路径。
#
# Windows 默认配置路径通常是：
#   %APPDATA%\taskdaemon\config.yaml
#
# 开发期如果需要项目内配置，可复制为 services/taskdaemon-go/taskdaemon.yaml。
# 本机专属覆盖可放到同目录 taskdaemon.local.yaml，不要提交到仓库；
# 未显式传 --config 时加载顺序为 defaults < taskdaemon.yaml < taskdaemon.local.yaml < env。
# 发布部署时建议只使用用户配置目录或显式 --config。

server:
  # HTTP API 监听地址。对外暴露前请先配置反向代理、TLS 与 Host/CSRF 安全策略。
  host: 127.0.0.1
  port: 39245
  swagger:
    # 生产环境默认关闭；需要调试 API 时再显式开启。
    enabled: true

database:
  # 支持 sqlite 或 postgres。
  driver: sqlite
  # SQLite 推荐使用 file: DSN，并开启外键。
  # dsn: file:taskdaemon.db?_fk=1

  # PostgreSQL 示例：
  # driver: postgres
  # dsn: postgres://taskdaemon:password@127.0.0.1:5432/taskdaemon?sslmode=disable

logging:
  # 支持 debug、info、warn、error。
  level: debug
  # 支持 console、file、both。console 适合本地开发，file 会使用轮转。
  output: both
  console:
    # 控制台默认 text，可读性更高。
    format: text
  file:
    # 文件日志默认 JSON，便于采集和检索。
    path: ./logs/taskdaemon.log
    format: json
    # lumberjack 原生轮转配置：按大小轮转，限制备份数量、保留天数和 gzip 压缩。
    maxSizeMB: 100
    maxBackups: 7
    maxAgeDays: 30
    compress: true
  http:
    # 请求/响应 body 日志默认关闭；本地排障时可在 taskdaemon.local.yaml 中开启。
    includeRequestBody: true
    includeResponseBody: true
    # body 只记录前 N 字节，超出时日志会带 *_truncated=true。
    maxBodyBytes: 4096
    # JSON body 中这些字段会递归脱敏；非 JSON body 会做保守文本脱敏。
    redactFields:
      - password
      - token
      - access_token
      - refresh_token
      - session
      - session_token
      - cookie
      - authorization
      - csrf
      - csrf_token

observability:
  traceId:
    # 响应头始终写入 X-Trace-Id；响应体默认也写入 traceId，方便排障复制。
    includeInResponse: true

audio:
  autoplay:
    # 收到外部音频播放请求后是否自动播放。关闭时仍会保存历史记录。
    enabled: false
    # 当前版本只支持 backend；frontend 预留给后续前端播放。
    target: backend
  playback:
    # 后端播放队列等待上限；0 表示无上限。
    queueLimit: 20
  inbound:
    # 入站 Bearer Token 只保存 SHA-256 哈希，原文只在生成时显示一次。
    tokenHash: ""
    # 上传或下载的音频文件大小上限，默认 200MB。
    maxBytes: 209715200
    url:
      # 默认只允许 HTTPS；内网 HTTP 场景需要显式加入 http。
      allowedSchemes:
        - https
      # 默认禁止回环、链路本地和私有网段；内网音频源需要显式开启。
      allowPrivateNetworks: false
      # 留空表示不限制 Host；需要更细安全策略时填写域名或 IP。
      allowedHosts: []
      downloadTimeoutSeconds: 60
      maxRedirects: 3
  history:
    # 最近音频记录保留条数；0 表示无上限。
    limit: 50
  ffmpeg:
    # 留空时按内置二进制 -> PATH 解析；正式包优先内置。
    path: ""
    probePath: ""
    transcodeTimeoutSeconds: 120

# T2a / T4: 通知事件总线与出站 sink（默认关闭出站通道）
notify:
  bufferSize: 256
  store:
    enabled: true
    maxRecords: 200
    retainDays: 30
    minSeverity: ""
  # T4
  webhook:
    enabled: false
    defaultTimeoutSec: 10
    defaultMaxRetries: 2
    defaultBackoffMs: 200
    # 默认仅 https，并拒绝私网；内网 webhook 需显式 allowPrivateNetworks: true
    allowedSchemes:
      - https
    allowPrivateNetworks: false
    allowedHosts: []
    maxRedirects: 3
    targets: []
    # targets 示例：
    # - name: ops
    #   url: https://hooks.example.com/taskdaemon
    #   enabled: true
    #   method: POST
    #   headers:
    #     Authorization: Bearer <token>
    #   signingSecret: <hmac-secret>
    #   signingHeader: X-Taskdaemon-Signature
  email:
    enabled: false
    minSeverity: error
    from: ""
    to: []
    timeoutSeconds: 15
    maxRetries: 2
    backoffMs: 200
    smtp:
      host: ""
      port: 587
      username: ""
      # 密码不明文回显；勿写入日志
      password: ""
      encryption: starttls

# 环境变量覆盖示例：
# TASKDAEMON_SERVER_HOST=127.0.0.1
# TASKDAEMON_SERVER_PORT=39245
# TASKDAEMON_SERVER_SWAGGER_ENABLED=false
# TASKDAEMON_DATABASE_DRIVER=sqlite
# TASKDAEMON_DATABASE_DSN=file:taskdaemon.db?_fk=1
# TASKDAEMON_LOGGING_LEVEL=info
# TASKDAEMON_LOGGING_OUTPUT=both
# TASKDAEMON_LOGGING_CONSOLE_FORMAT=text
# TASKDAEMON_LOGGING_FILE_PATH=./logs/taskdaemon.log
# TASKDAEMON_LOGGING_FILE_FORMAT=json
# TASKDAEMON_LOGGING_FILE_MAX_SIZE_MB=100
# TASKDAEMON_LOGGING_FILE_MAX_BACKUPS=7
# TASKDAEMON_LOGGING_FILE_MAX_AGE_DAYS=30
# TASKDAEMON_LOGGING_FILE_COMPRESS=true
# TASKDAEMON_LOGGING_HTTP_INCLUDE_REQUEST_BODY=false
# TASKDAEMON_LOGGING_HTTP_INCLUDE_RESPONSE_BODY=false
# TASKDAEMON_LOGGING_HTTP_MAX_BODY_BYTES=4096
# TASKDAEMON_LOGGING_HTTP_REDACT_FIELDS=password,token,cookie,authorization
# TASKDAEMON_OBSERVABILITY_TRACE_ID_INCLUDE_IN_RESPONSE=true
# TASKDAEMON_AUDIO_AUTOPLAY_ENABLED=false
# TASKDAEMON_AUDIO_AUTOPLAY_TARGET=backend
# TASKDAEMON_AUDIO_PLAYBACK_QUEUE_LIMIT=20
# TASKDAEMON_AUDIO_INBOUND_TOKEN_HASH=<sha256>
# TASKDAEMON_AUDIO_INBOUND_MAX_BYTES=209715200
# TASKDAEMON_AUDIO_INBOUND_URL_ALLOWED_SCHEMES=https,http
# TASKDAEMON_AUDIO_INBOUND_URL_ALLOW_PRIVATE_NETWORKS=false
# TASKDAEMON_AUDIO_INBOUND_URL_ALLOWED_HOSTS=media.internal.local
# TASKDAEMON_AUDIO_INBOUND_URL_DOWNLOAD_TIMEOUT_SECONDS=60
# TASKDAEMON_AUDIO_INBOUND_URL_MAX_REDIRECTS=3
# TASKDAEMON_AUDIO_HISTORY_LIMIT=50
# TASKDAEMON_AUDIO_FFMPEG_PATH=
# TASKDAEMON_AUDIO_FFMPEG_PROBE_PATH=
# TASKDAEMON_AUDIO_FFMPEG_TRANSCODE_TIMEOUT_SECONDS=120
